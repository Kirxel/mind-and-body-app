services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      API_APP_ENV: ${API_APP_ENV}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS}
      API_INQUIRY_COOLDOWN_SECONDS: ${API_INQUIRY_COOLDOWN_SECONDS}
    ports:
      - "8000:8000"

